name: vacancy-pipeline

on:
  schedule:
    - cron: '17 3 * * *'    # ~06:17 Мск, основной
    - cron: '17 8 * * *'    # ~11:17 Мск, страховочный - догоняет пропуски, не вторая рассылка
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Restore credentials
        run: printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      - name: Run pipeline
        run: python run_all.py
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TRACKER_SPREADSHEET_ID: ${{ secrets.TRACKER_SPREADSHEET_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CREDENTIALS_FILE: credentials.json
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SUBSCRIBERS_API_SECRET: ${{ secrets.SUBSCRIBERS_API_SECRET }}
